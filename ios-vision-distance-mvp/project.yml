name: VisionDistanceMVP
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  VisionMVPCore:
    path: .
targets:
  VisionDistanceMVP:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Assets.xcassets lives inside this tree; XcodeGen auto-detects it as a
      # resource (not a compiled source) — no separate `resources:` entry needed.
      - path: VisionDistanceMVP
    dependencies:
      - package: VisionMVPCore
        product: VisionMVPCore
    info:
      properties:
        CFBundleDisplayName: "Distancia Visual"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: >-
          Esta app usa la cámara TrueDepth para calcular, en el propio dispositivo,
          la distancia y posición de tu rostro respecto a la pantalla. No se graban
          fotografías ni videos en ningún momento.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wemul.visiondistancemvp
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VisionDistanceMVP:
    build:
      targets:
        VisionDistanceMVP: all
    run:
      config: Debug
    archive:
      config: Release
